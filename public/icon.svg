<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe-zone margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Atomic Orbital Rings -->
  <g transform="translate(256, 260)">
    <ellipse rx="150" ry="60" fill="none" stroke="url(#orbitGrad)" stroke-width="8" stroke-dasharray="14 10" transform="rotate(-30)" opacity="0.75" />
    <ellipse rx="150" ry="60" fill="none" stroke="#60a5fa" stroke-width="8" stroke-dasharray="14 10" transform="rotate(30)" opacity="0.75" />
    <ellipse rx="150" ry="60" fill="none" stroke="#a78bfa" stroke-width="7" stroke-dasharray="10 8" transform="rotate(90)" opacity="0.6" />

    <!-- Orbital Electrons / Atoms -->
    <circle cx="130" cy="-65" r="14" fill="#fbbf24" filter="url(#glow)" />
    <circle cx="-130" cy="65" r="14" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="0" cy="-145" r="12" fill="#34d399" filter="url(#glow)" />
    <circle cx="0" cy="145" r="12" fill="#f43f5e" filter="url(#glow)" />
  </g>

  <!-- Flask Outline and Liquid Body -->
  <g filter="url(#glow)">
    <!-- Liquid inside flask -->
    <path d="M 226 250 L 160 365 C 145 390 162 420 195 420 L 317 420 C 350 420 367 390 352 365 L 286 250 Z" fill="url(#liquidGrad)" opacity="0.85" />
    
    <!-- Bubbles in liquid -->
    <circle cx="236" cy="360" r="10" fill="#a7f3d0" opacity="0.8" />
    <circle cx="280" cy="380" r="7" fill="#a7f3d0" opacity="0.8" />
    <circle cx="250" cy="320" r="6" fill="#a7f3d0" opacity="0.7" />

    <!-- Flask Neck and Lip Glass Outline -->
    <path d="M 220 120 L 292 120 M 230 120 L 230 240 L 150 375 C 130 405 152 440 190 440 L 322 440 C 360 440 382 405 362 375 L 282 240 L 282 120" 
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Graduation marks on neck/flask -->
    <line x1="240" y1="180" x2="255" y2="180" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />
    <line x1="240" y1="210" x2="260" y2="210" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Center Sparkle / Catalyst -->
  <path d="M 256 300 Q 256 312 266 312 Q 256 312 256 324 Q 256 312 246 312 Q 256 312 256 300 Z" fill="#ffffff" />
</svg>
